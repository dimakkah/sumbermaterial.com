name: Cleanup Old GitHub Pages Deployments

on:
  schedule:
    # Weekly (Monday 03:00 UTC), not monthly — this site's deploy volume is much higher than
    # originally assumed (generate-articles.yml + revise-articles.yml run daily, both trigger
    # deploy.yml, plus fix-orphans.yml + recycle.yml run weekly and also trigger deploy) so
    # deployment records pile up far faster than a monthly schedule could keep up with.
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      keep_count:
        description: 'How many of the newest deployments to leave untouched (the active one + a small buffer)'
        required: false
        default: '5'

concurrency:
  group: cleanup-deployments
  cancel-in-progress: false

permissions:
  deployments: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old github-pages deployments (keep newest N)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          KEEP_COUNT: ${{ github.event.inputs.keep_count || '5' }}
        run: |
          echo "🔍 Fetching all deployment IDs for $REPO (environment: github-pages)..."
          mapfile -t ALL_IDS < <(gh api --paginate \
            "/repos/$REPO/deployments?environment=github-pages&per_page=100" \
            -q '.[].id')

          TOTAL=${#ALL_IDS[@]}
          echo "📊 Total deployments found: $TOTAL"
          echo "🔒 Keeping newest: $KEEP_COUNT"

          if [ "$TOTAL" -le "$KEEP_COUNT" ]; then
            echo "✅ Nothing to delete ($TOTAL ≤ $KEEP_COUNT)."
            exit 0
          fi

          TO_DELETE=("${ALL_IDS[@]:$KEEP_COUNT}")
          echo "🗑️  Attempting to delete ${#TO_DELETE[@]} older deployment(s)..."

          DELETED=0
          SKIPPED=0
          FAILED=0

          for id in "${TO_DELETE[@]}"; do
            # FIX #1: check the LATEST status first (instead of blindly forcing a new status
            # POST). GitHub already auto-marks any "github-pages" deployment as inactive as
            # soon as a newer one succeeds — so older deployments are usually ALREADY inactive
            # and don't need to be forced again. Forcing a new status POST on a deployment
            # whose status is already final can get rejected by the API (and previously this
            # error was hidden by `|| true`, which is why it went unnoticed).
            latest_state=$(gh api "/repos/$REPO/deployments/$id/statuses?per_page=1" \
              -q '.[0].state // "none"' 2>&1) || latest_state="error"

            echo "   Deployment $id — latest status: $latest_state"

            if [ "$latest_state" = "success" ] || [ "$latest_state" = "active" ]; then
              echo "   ⏭️  Skipped — status is still '$latest_state' (may still be relevant, not forcing deletion)."
              SKIPPED=$((SKIPPED + 1))
              continue
            fi

            if [ "$latest_state" != "inactive" ]; then
              # Not yet inactive (empty/error/pending/other state) — try to transition it first.
              # FIX #2: errors here are now SHOWN, no longer discarded to /dev/null.
              inactive_result=$(gh api --method POST "/repos/$REPO/deployments/$id/statuses" \
                -f "state=inactive" 2>&1)
              if [ $? -ne 0 ]; then
                echo "   ⚠️  Failed to set inactive status for $id:"
                echo "   $inactive_result" | head -5
                FAILED=$((FAILED + 1))
                continue
              fi
            fi

            # FIX #3: delete errors are also shown in full, not discarded.
            delete_result=$(gh api --method DELETE "/repos/$REPO/deployments/$id" 2>&1)
            if [ $? -eq 0 ]; then
              DELETED=$((DELETED + 1))
              echo "   ✅ Deleted $id"
            else
              FAILED=$((FAILED + 1))
              echo "   ⚠️  Failed to delete deployment $id:"
              echo "   $delete_result" | head -5
            fi
          done

          echo ""
          echo "✅ Deleted : $DELETED"
          echo "⏭️  Skipped : $SKIPPED (status still success/active, intentionally left alone)"
          echo "❌ Failed  : $FAILED"
          if [ "$FAILED" -gt 0 ]; then
            echo ""
            echo "⚠️  Some deletions failed — read the error messages above for the exact reason"
            echo "   (previously these were hidden; they're now shown on purpose)."
          fi
          echo ""
          echo "ℹ️  This only removes deployment history RECORDS — it does not touch the"
          echo "   gh-pages branch or affect the live site in any way."
