name: Dedup Directional-Suffix Articles

# Monthly, not daily/weekly — this class of duplicate (same article, only differing by a
# directional/area word like "timur"/"barat") only appears when generate-articles.js happens
# to process two closely-related GSC keywords that both resolve to the same base location.
# That's a slow-growing edge case, not something that needs checking constantly.
on:
  schedule:
    - cron: '0 4 15 * *'
  workflow_dispatch:

concurrency:
  group: dataweb-repo-write
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  dedup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Find & delete directional-suffix duplicates, update redirects.js
        run: node tools/dedup-directional-suffix.js --apply

      - name: Sync redirects.js to Cloudflare Workers KV (real 301s)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_KV_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
        run: |
          if [ -z "$CLOUDFLARE_KV_NAMESPACE_ID" ]; then
            echo "ℹ️  CLOUDFLARE_KV_NAMESPACE_ID not set — skipping KV sync."
            echo "   redirects.js was still updated; the client-side JS redirect will work,"
            echo "   just without the real-301 Worker in front of it. See"
            echo "   cloudflare-worker-redirects.js for setup instructions."
            exit 0
          fi
          node tools/sync-redirects-to-kv.js --apply

      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Commit and Push Changes
        id: commit_push
        run: |
          git add content/ static/redirects.js

          if git diff --staged --quiet; then
            echo "ℹ️  Nothing to commit (no directional-suffix duplicates found this run) — done."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "Remove directional-suffix duplicate articles, add redirects"

          for i in 1 2 3 4 5; do
            if git push origin master; then
              echo "✅ Push succeeded (attempt $i)."
              echo "published=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$i" -eq 5 ]; then
              echo "❌ Push still failed after 5 attempts — there may be a real conflict; check manually." >&2
              exit 1
            fi
            wait_s=$(( (RANDOM % 10) + 5 ))
            echo "⏳ Push rejected (possible race with another workflow), rebasing & trying again in ${wait_s}s... (attempt $i/5)"
            sleep "$wait_s"
            git fetch origin master
            git stash push -u -m "pre-rebase-autostash" || true
            git rebase origin/master
            git stash drop || true
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Pushes made with GITHUB_TOKEN above do NOT trigger deploy.yml's `push` trigger
      # (GitHub's anti-recursion safeguard — see the identical step in the other content
      # workflows). Without this, deleted articles would stay live until deploy.yml's next
      # unrelated trigger.
      - name: Trigger Deploy (publish the removals now)
        if: steps.commit_push.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🚀 Duplicate articles removed — triggering deploy.yml so the change goes live now..."
          gh workflow run deploy.yml --ref master
