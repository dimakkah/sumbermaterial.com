name: Reset gh-pages History (every 6 months + manual)

# Scheduled every 6 months (Jan 1 and Jul 1, 03:00 UTC). This is the ONLY mechanism that clears
# gh-pages history in this repo — routine deploys (deploy.yml / recycle.yml) deliberately commit
# incrementally, NOT with `force_orphan: true`, since a full-tree commit on every single deploy
# (this repo deploys multiple times a day) is expensive. That trade-off means gh-pages DOES
# accumulate commits between resets — roughly 6 months' worth each time — so unlike a pure
# safety net, this workflow is expected to find real history to clear on every scheduled run,
# not just occasionally. 6 months keeps that accumulation bounded to a moderate, predictable
# amount (nowhere near the years of unbounded growth this repo had before this workflow
# existed) while keeping routine deploys cheap. Can also be triggered manually anytime via
# workflow_dispatch if history needs to be cleared sooner.
on:
  schedule:
    - cron: '0 3 1 1,7 *'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type exactly RESET to confirm (this permanently deletes ALL gh-pages commit history — cannot be undone)'
        required: true

concurrency:
  group: dataweb-repo-write
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  reset-gh-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Validate confirmation input
        run: |
          # Scheduled runs don't provide this input at all — only require it for manual
          # workflow_dispatch runs, so the 6-month cron trigger doesn't need a human present.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.confirm }}" != "RESET" ]; then
            echo "❌ Confirmation text did not match. Type exactly 'RESET' (all caps) to run this."
            exit 1
          fi
          echo "✅ Confirmed, proceeding."

      - name: Checkout Repository (shallow — no history needed)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Create fresh orphan gh-pages branch
        run: |
          echo "📊 .git size BEFORE reset:"
          du -sh .git

          git checkout --orphan gh-pages-reset
          git rm -rf . > /dev/null
          echo "This branch is managed automatically by deploy.yml / recycle.yml — do not edit manually." > README.md
          git add README.md
          git commit -m "Reset gh-pages: clear old commit history"

      - name: Force-push as new gh-pages
        run: |
          git push origin gh-pages-reset:gh-pages --force
          echo "✅ gh-pages has been reset to a single commit."

      # The live site will briefly show a blank/404 page since the new gh-pages branch only
      # contains README.md at this point — trigger deploy.yml immediately so the actual built
      # site republishes right away and minimizes downtime.
      - name: Trigger Deploy (republish immediately to minimize downtime)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🚀 Triggering deploy.yml so the site is live again..."
          gh workflow run deploy.yml --ref master

      - name: Summary
        run: |
          echo "✅ Reset complete. deploy.yml has been triggered to repopulate gh-pages."
          echo "ℹ️  Check the Actions tab in a few minutes to confirm deploy.yml finished"
          echo "   successfully, then check the live site to confirm it's back to normal."
          echo ""
          echo "ℹ️  By design, gh-pages will start accumulating incremental commits again from"
          echo "   the very next deploy — routine deploys intentionally commit incrementally"
          echo "   rather than resetting on every run (see deploy.yml / recycle.yml comments)."
          echo "   That's expected: this workflow's 6-month schedule is what keeps that growth"
          echo "   bounded, not a one-time fix. No action needed until the next scheduled run."
